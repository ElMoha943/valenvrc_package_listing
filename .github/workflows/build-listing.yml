name: Build and Deploy Website

on: 
  workflow_dispatch:
  push:
    branches: main

# Sets permissions of the GITHUB_TOKEN to allow pushing to branches
permissions:
  contents: write
  
# Allow one concurrent deployment
concurrency:
  group: "production-deploy"
  cancel-in-progress: true

jobs:
  
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v4
      
      - name: Checkout Package Listing Repo
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ci
          clean: false
      
      - name: Build Package Version Listing
        run: |
          mkdir -p build/vpm
          ci/build.sh BuildMultiPackageListing --root ci \
            --package-listing-source-folder "$GITHUB_WORKSPACE" \
            --list-publish-directory "$GITHUB_WORKSPACE/build/vpm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render website
        run: python3 build_site.py --vpm-index build/vpm/index.json
      
      - name: Deploy to production branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: production
          cname: valenvrc.com
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ github.sha }}'
          allow_empty_commit: false
